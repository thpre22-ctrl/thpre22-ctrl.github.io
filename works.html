<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works · E A Prentzas</title>
<meta name="description" content="Thanos Prentzas, architect in Athens. Selected academic and professional work 2019–2026.">
<meta property="og:title" content="Thanos Prentzas · Architect">
<meta property="og:description" content="Selected academic and professional work 2019–2026.">
<meta property="og:image" content="img/lk/01.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">
<style>
:root{--ink:#141414;--text:#333;--muted:#7a7a7a;--line:#e4e4e4;--paper:#141414;--white:#fff;--accent:#141414;--serif:'Montserrat',Arial,sans-serif;--sans:'Montserrat',Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--text);font:400 15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}img{max-width:100%;display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
/* nav */
header{position:fixed;inset:0 0 auto;z-index:20;transition:background .3s,box-shadow .3s}
header.solid{background:rgba(255,255,255,.94);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(6px)}
.nav{display:flex;justify-content:space-between;align-items:center;height:76px}
.logo{display:flex;align-items:center;gap:14px;font:500 12px/1 var(--sans);letter-spacing:.38em;text-decoration:none;color:var(--white);transition:color .3s}
.logo i{width:44px;height:44px;border:1.5px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--sans);letter-spacing:.02em;font-style:normal}
header.solid .logo{color:var(--ink)}
.menu{display:flex;gap:34px}
.menu a{font-size:12px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--white);transition:color .3s}
header.solid .menu a{color:var(--ink)}
.menu a:hover{color:var(--accent)!important}
/* hero */
.hero{position:relative;height:100vh;min-height:560px;max-height:1100px;overflow:hidden;background:#222}
.hero img,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.hero .on{opacity:1}
.hero img.on{animation:zoom 9s ease-out both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero .dots{position:absolute;z-index:3;right:28px;bottom:34px;display:flex;gap:8px}
.hero .dots i{width:22px;height:2px;background:rgba(255,255,255,.35);display:block;transition:background .4s}
.hero .dots i.on{background:#fff}
.hmark{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;pointer-events:none}
.hmark .c{width:clamp(120px,16vw,190px);height:clamp(120px,16vw,190px);border:2.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 clamp(40px,5.5vw,64px)/1 var(--sans);text-shadow:0 2px 14px rgba(0,0,0,.35);box-shadow:0 2px 24px rgba(0,0,0,.25)}
.hmark .t{margin-top:26px;font:500 clamp(13px,1.4vw,17px)/1 var(--sans);letter-spacing:.45em;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.hmark .s{margin-top:12px;font:400 11px/1 var(--sans);letter-spacing:.35em;opacity:.85;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.42),rgba(0,0,0,.18) 55%,rgba(0,0,0,.35))}
.hero .cap{position:absolute;z-index:2;left:0;right:0;bottom:70px;color:#fff}
.eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.hero .eyebrow{color:#e2cfac}
.hero h1{font:300 clamp(54px,9vw,120px)/.92 var(--serif);margin:0 0 18px;letter-spacing:.01em}
.hero p{margin:0;font-size:15px;letter-spacing:.08em;opacity:.9;max-width:90vw}
/* sections */
section{padding:120px 0;border-top:1px solid var(--line);position:relative;z-index:1;background:var(--white)}
.hero{border:0}
.sec-tag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h2{font:500 clamp(20px,2.6vw,30px)/1.3 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin:0 0 30px}
.about{display:grid;grid-template-columns:5fr 7fr;gap:80px;align-items:start}
.about img{aspect-ratio:4/5;object-fit:cover;object-position:50% 30%}
.lead{font:300 20px/1.6 var(--sans);color:var(--ink);margin:0 0 26px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px;border-top:1px solid var(--line);padding-top:26px}
.facts b{display:block;font:300 32px/1 var(--sans);color:var(--ink);margin-bottom:6px}
.facts span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
/* works */
.works{background:#fff;border-top:0!important}
.filters{display:flex;gap:10px;margin:0 0 38px;flex-wrap:wrap}
.filters button{font:400 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:10px 18px;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer}
.filters button.on,.filters button:hover{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:36px 28px}
.card{cursor:pointer;text-decoration:none}
.card .ph{overflow:hidden;aspect-ratio:1/1;background:#eee}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.card:hover img{transform:scale(1.05)}
.card .n{font:400 14px var(--serif);color:var(--accent);margin:16px 0 2px}
.card h3{font:500 11px/1.4 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin:16px 0 0;text-align:center}
.card p{margin:0;font-size:13px;color:var(--muted)}
/* project overlay */
.proj{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.proj.open{opacity:1;visibility:visible}
.proj .close{position:fixed;top:22px;right:28px;z-index:3;width:46px;height:46px;border-radius:50%;border:1px solid var(--ink);background:#fff;cursor:pointer;font:300 22px var(--sans)}
.proj .head{display:grid;grid-template-columns:4fr 8fr;gap:60px;padding:100px 0 60px}

.proj .head h2{margin-bottom:8px}
.proj .sub{font:300 18px/1.5 var(--sans);color:var(--muted);margin:0 0 30px;letter-spacing:0;text-transform:none}
.meta{border-top:1px solid var(--ink);margin:0}
.meta div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.meta dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.meta dd{margin:0;color:var(--ink)}
.desc p{margin:0 0 1.1em;font-size:15px;line-height:1.8}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding-bottom:100px}
.gallery img{width:100%;cursor:zoom-in;background:var(--paper)}
.gallery img.wide{grid-column:1/-1;max-height:88vh;object-fit:cover}
.gallery video{width:100%;grid-column:1/-1;display:block;background:#111}
.pnav{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:30px 0 60px}
.pnav button{background:none;border:0;cursor:pointer;font:500 13px var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--ink)}
.pnav button span{display:block;font:400 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:40;background:#141414;display:none;align-items:center;justify-content:center}
.lb.open{display:flex}.lb img{max-width:88vw;max-height:90vh;object-fit:contain}
.lbn{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font:300 64px/1 var(--sans);cursor:pointer;padding:20px 24px;opacity:.75}.lbn:hover{opacity:1}.lbn.prev{left:10px}.lbn.next{right:10px}
.lbc{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#aaa;font-size:11px;letter-spacing:.3em;text-transform:uppercase;pointer-events:none}
.lbx{position:fixed;top:22px;right:28px;width:46px;height:46px;border-radius:50%;border:1px solid #fff;background:none;color:#fff;cursor:pointer;font:300 22px var(--sans);z-index:70;display:none}
.lbt{position:fixed;right:28px;bottom:22px;padding:12px 22px;border:1px solid #fff;background:none;color:#fff;cursor:pointer;font:500 11px var(--sans);letter-spacing:.3em;z-index:70;display:none}
body.viewing .lbx,body.viewing .lbt{display:block}
body.viewing.text .lbx,body.viewing.text .lbt{color:#141414;border-color:#141414;background:#fff}
.proj{z-index:50}.proj .close{display:none}.proj .head{padding-top:90px}
/* cv + contact */
.cv{display:grid;grid-template-columns:repeat(2,1fr);gap:70px}
.row{display:grid;grid-template-columns:140px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line)}
.row .d{font-size:12px;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.row b{display:block;font-weight:400;color:var(--ink)}
.row small{font-size:14px;color:var(--muted)}
.btn{display:inline-block;margin-top:30px;padding:14px 26px;border:1px solid var(--ink);text-decoration:none;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.btn:hover{background:var(--ink);color:#fff}
.contact{background:#fff;color:#555;text-align:center}
.contact .mono{width:120px;height:120px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 34px;font:600 40px/1 var(--sans);color:var(--ink)}
.contact h2{color:var(--ink)}
.contact a.big{display:block;font:300 clamp(18px,2.6vw,28px)/1.6 var(--sans);letter-spacing:.08em;color:var(--ink);text-decoration:none}
.contact a.big:hover{color:var(--accent)}
footer{background:#fff;color:#999;font-size:11px;letter-spacing:.25em;text-transform:uppercase;text-align:center;padding:0 0 40px}
@media(max-width:900px){
 .menu{gap:18px}.menu a{font-size:11px;letter-spacing:.14em}
 .about,.cv,.proj .head{grid-template-columns:1fr;gap:40px}
 .grid{grid-template-columns:1fr 1fr;gap:28px 16px}.card h3{font-size:21px}
 .gallery{grid-template-columns:1fr}.gallery img.wide{grid-column:auto}
 section{padding:80px 0}.wrap{padding:0 18px}.facts{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:560px){.menu a:not(.keep){display:none}.grid{grid-template-columns:1fr}.facts b{font-size:26px}}
</style>
<style>
/* split pages */
body.inner header{position:sticky;background:#fff;box-shadow:0 1px 0 var(--line)}
body.inner header .logo,body.inner header .menu a{color:var(--ink)}
body.inner.dark header{background:#141414;box-shadow:0 1px 0 #2a2a2a}
body.inner.dark header .logo,body.inner.dark header .menu a{color:#fff}
body.inner main>section{border-top:0;min-height:calc(100vh - 76px)}
body.home{overflow:hidden;height:100vh}
body.home .hero{height:100vh;max-height:none}
header .menu a.cur{text-decoration:underline;text-underline-offset:6px}
</style></head>
<body class="inner">
<header id="hdr"><div class="wrap nav"><a class="logo" href="index.html"><i>eap.</i>E A PRENTZAS</a>
<nav class="menu"><a class="keep" href="works.html" class="cur keep">Works</a><a href="about.html">About</a><a class="keep" href="contact.html">Contact</a></nav></div></header>
<main>
<section class="works" id="works"><div class="wrap">
  <div class="grid" id="grid"></div>
</div></section>
<footer>© <span id="yr"></span> E A Prentzas · Architect · Athens</footer>
<div class="proj" id="proj"><button class="close" id="pclose" aria-label="Close">×</button><div class="wrap" id="pbody"></div></div>
<div class="lb" id="lb"><button class="lbn prev" id="lbprev" aria-label="Previous">‹</button><img id="lbimg" alt=""><button class="lbn next" id="lbnext" aria-label="Next">›</button><div class="lbc" id="lbc"></div></div>
<button class="lbx" id="lbx" aria-label="Close">×</button><button class="lbt" id="lbt">TEXT</button>
</main>
<script src="data.js"></script><script>
document.getElementById('yr')&&(document.getElementById('yr').textContent=new Date().getFullYear());
const P = window.PROJECTS, grid = document.getElementById('grid');
document.getElementById('yr').textContent = new Date().getFullYear();
function cards(f){ grid.innerHTML = P.filter(p=>f==='all'||p.cat===f).map(p=>`<a class="card" href="#p-${p.key}"><div class="ph"><img src="${p.images[0]}" alt="${p.title}" loading="lazy"></div><h3>${p.title}</h3></a>`).join(''); }
cards('all');
const proj=document.getElementById('proj'), body=document.getElementById('pbody');
let cur=null, gal=[], gi=0;
function show(key){ const i=P.findIndex(p=>p.key===key); if(i<0){ lb.classList.remove('open'); proj.classList.remove('open'); document.body.style.overflow=''; return; }
  const p=P[i]; cur=p; gal=p.images.filter(s=>!/\.mp4$/.test(s)); gi=0;
  body.innerHTML=`<div class="head"><div><p class="eyebrow">${p.num} · ${p.cat}</p><h2>${p.title}</h2><p class="sub">${p.sub}</p>
   <dl class="meta">${p.meta.map(m=>`<div><dt>${m[0]}</dt><dd>${m[1]}</dd></div>`).join('')}</dl></div>
   <div class="desc">${p.desc.split(/\n\s*\n/).map(t=>`<p>${t}</p>`).join('')}${p.link?`<p><a class="btn" href="${p.link[1]}" target="_blank" rel="noopener">${p.link[0]} ↗</a></p>`:''}</div></div>`;
  proj.classList.remove('open'); document.getElementById('lbt').textContent='TEXT'; document.body.classList.add('viewing'); document.body.classList.remove('text');
  document.body.style.overflow='hidden'; openLb(); }
function openLb(){ lbimg.src=gal[gi]; document.getElementById('lbc').textContent=cur.title+'  ·  '+(gi+1)+' / '+gal.length; lb.classList.add('open'); }
function lbNav(d){ gi=(gi+d+gal.length)%gal.length; openLb(); }
function toggleText(){ const on=proj.classList.toggle('open'); document.body.classList.toggle('text',on); document.getElementById('lbt').textContent=on?'IMAGES':'TEXT'; if(on) proj.scrollTop=0; }
function closeAll(){ lb.classList.remove('open'); proj.classList.remove('open'); document.body.classList.remove('viewing','text'); document.body.style.overflow=''; history.pushState('',document.title,location.pathname); }
function route(){ const h=location.hash; if(h.startsWith('#p-')) show(h.slice(3)); else { lb.classList.remove('open'); proj.classList.remove('open'); document.body.classList.remove('viewing','text'); document.body.style.overflow=''; } }
window.addEventListener('hashchange',route);
document.getElementById('pclose').onclick=closeAll;
const lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'); lbimg.onclick=()=>lbNav(1); document.getElementById('lbx').onclick=closeAll; document.getElementById('lbt').onclick=toggleText;
document.getElementById('lbprev').onclick=e=>{ e.stopPropagation(); lbNav(-1); }; document.getElementById('lbnext').onclick=e=>{ e.stopPropagation(); lbNav(1); };
document.addEventListener('keydown',e=>{ if(lb.classList.contains('open')&&!proj.classList.contains('open')){ if(e.key==='ArrowRight') lbNav(1); if(e.key==='ArrowLeft') lbNav(-1); } if(e.key==='Escape') closeAll(); });
route();

</script>
</body></html>
